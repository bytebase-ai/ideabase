[package]
name = "ideabase"
version = "1.0.0"
edition = "2024"
description = "BaaS powered by AI, 兼具安全与性能的国产Firebase！"
authors = [
    "ReliefZk <reliefzk@gmail.com>",
]
keywords = ["baas", "ai-baas", "firebase", "supabase"]

[dependencies]
lazy_static = { version = "1"}
log = {  version = "0.4" }
tklog = { version = "0.2" }
uuid7 = { version = "1.1" }
regex = { version = "1" }
fnv = { version = "1.0" }
once_cell = { version = "1.21" }
jsonwebtoken = { version = "9" }
chrono = { version = "0.4", features=["serde"] }
figment = { version = "0.10", features = ["yaml"] }
argon2 = { version = "0.5", default-features = false, features = ["std", "alloc", "password-hash", "rand"] }

base64 = { version = "0.22" }

# json
serde_json = { version = "1" }
serde = { version = "1.0", features = ["derive"] }

# web
http = { version = "1.3" }
actix-cors = { version = "0.7" }
actix-web = { version = "4" }

# sqlx
sqlx = { version = "0.8", features = ["mysql", "chrono", "rust_decimal"] }

# nio
tokio = { version = "1", features = ["full"]}
